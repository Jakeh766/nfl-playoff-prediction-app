name: Test and deploy dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-environment
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/bootstrap.js
          node --check frontend/leaderboard.js
          node --check frontend/picks.js
          node --check frontend/shell.js
          node --check frontend/auth-config.js

      - name: Check backend Python syntax
        run: python -m py_compile backend/lambda/app.py

      - name: Test authenticated prediction ownership
        run: python -m unittest discover -s backend -p "test_*.py"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform for validation
        run: terraform -chdir=terraform/envs/dev init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform/envs/dev validate

  deploy:
    name: Deploy dev
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Check deployment configuration
        shell: bash
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "AWS_ROLE_ARN is not configured in the dev environment."; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET is not configured in the dev environment."; exit 1; }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize dev Terraform state
        run: >-
          terraform -chdir=terraform/envs/dev init
          -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Verify migrated dev state
        shell: bash
        run: |
          state_resources="$(terraform -chdir=terraform/envs/dev state list)"
          if [[ -z "$state_resources" ]]; then
            echo "The remote dev state is empty. Migrate the existing local state before deploying."
            exit 1
          fi

      - name: Plan dev deployment
        run: terraform -chdir=terraform/envs/dev plan -out=tfplan

      - name: Apply dev deployment
        run: terraform -chdir=terraform/envs/dev apply tfplan

      - name: Seed demo participants and private groups
        run: |
          python3 backend/seed_dev.py \
            --profiles-table "$(terraform -chdir=terraform/envs/dev output -raw profiles_table)" \
            --predictions-table "$(terraform -chdir=terraform/envs/dev output -raw predictions_table)" \
            --groups-table "$(terraform -chdir=terraform/envs/dev output -raw groups_table)" \
            --region "$AWS_REGION"

      - name: Publish deployment URLs
        shell: bash
        run: |
          {
            echo "## Dev deployment"
            echo ""
            echo "- App: $(terraform -chdir=terraform/envs/dev output -raw app_url)"
            echo "- API: $(terraform -chdir=terraform/envs/dev output -raw api_url)"
          } >> "$GITHUB_STEP_SUMMARY"
